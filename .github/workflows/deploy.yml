name: Deploy

on:
  push:
    branches: [ "main" ]

#one deploy at a time; never cancel a run that is mid-rollout
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # required for Workload Identity Federation

jobs:
  #re-run the exact test suite that gates PRs, so a direct push to main
  #that skipped review still cannot deploy broken code
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GCP config
        env:
          RAW_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RAW_REGION: ${{ vars.GCP_REGION }}
          RAW_BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
          RAW_AR_REPO: ${{ vars.GCP_AR_REPO }}
          RAW_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          RAW_CI_SA: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          RAW_API_SA: ${{ vars.GCP_API_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          #strip any whitespace/CR/newline a copy-paste left in a repo variable
          strip() { local v="$1"; printf '%s' "${v//[$'\r\n\t ']/}"; }
          PROJECT_ID=$(strip "$RAW_PROJECT_ID")
          REGION=$(strip "$RAW_REGION")
          BUCKET_NAME=$(strip "$RAW_BUCKET_NAME")
          AR_REPO=$(strip "$RAW_AR_REPO")
          WIF_PROVIDER=$(strip "$RAW_WIF_PROVIDER")
          CI_SA=$(strip "$RAW_CI_SA")
          API_SA=$(strip "$RAW_API_SA")

          for name in PROJECT_ID REGION BUCKET_NAME AR_REPO WIF_PROVIDER CI_SA API_SA; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable GCP_${name} is not set"
              exit 1
            fi
          done

          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "REGION=$REGION"
            echo "BUCKET_NAME=$BUCKET_NAME"
            echo "WIF_PROVIDER=$WIF_PROVIDER"
            echo "CI_SA=$CI_SA"
            echo "API_SA=$API_SA"
            echo "REGISTRY=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
          } >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the API and trainer images
        run: |
          set -euo pipefail
          docker build api --file api/api.DOCKERFILE \
            --tag "$REGISTRY/yolo-api:$GITHUB_SHA" --tag "$REGISTRY/yolo-api:latest"
          docker build trainer_image --file trainer_image/trainer.DOCKERFILE \
            --tag "$REGISTRY/yolo-trainer:$GITHUB_SHA" --tag "$REGISTRY/yolo-trainer:latest"
          docker push "$REGISTRY/yolo-api:$GITHUB_SHA"
          docker push "$REGISTRY/yolo-api:latest"
          docker push "$REGISTRY/yolo-trainer:$GITHUB_SHA"
          docker push "$REGISTRY/yolo-trainer:latest"

      - name: Deploy the API to Cloud Run
        run: |
          set -euo pipefail
          #public service — the app's bearer token is the security boundary.
          #For a private service swap --allow-unauthenticated for --no-allow-unauthenticated.
          gcloud run deploy yolo-api \
            --image "$REGISTRY/yolo-api:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "$API_SA" \
            --allow-unauthenticated \
            --set-env-vars "BUCKET_NAME=$BUCKET_NAME,PROJECT_ID=$PROJECT_ID,REGION=$REGION,VERTEX_CONTAINER_URI=$REGISTRY/yolo-trainer:$GITHUB_SHA" \
            --set-secrets "API_TOKENS=api-tokens:latest"
